# Mod
modId=serverpropertiesreload
modName=Server Properties Reload
modDescription=Adds '/properties' command to modify or reload server properties
modAuthor=chylex
modVersion=1.0.3
modLicense=MPL-2.0
modSourcesURL=https://github.com/chylex/Minecraft-Server-Properties-Reload
modIssuesURL=https://github.com/chylex/Minecraft-Server-Properties-Reload/issues

# Dependencies
minecraftVersion=26.2
forgeVersion=50.0.0
fabricVersion=0.152.1+26.2
loaderVersion=0.19.3
mixinVersion=0.8.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft 26.1+ ships unobfuscated, so no mappings/remapping are needed.
# Loom auto-detects this for single-project builds, but in this multi-project
# setup the flag must be set explicitly so the 'mappings' configuration is not required.
fabric.loom.disableObfuscation=true
